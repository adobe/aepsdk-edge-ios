name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag (version) to be released (ex: 1.2.3).'
        type: string
        required: true

      create-github-release:
        description: 'Create a GitHub release with uploaded XCFramework artifacts. SPM consumers can also build from source via this tag. If the provided `tag` does not exist, it will be created.'
        type: boolean
        required: true
        default: true

jobs:
  release:
    permissions:
        contents: write
    uses: shushinde/aepsdk-commons/.github/workflows/ios-spm-release.yml@main
    with:
      tag: ${{ github.event.inputs.tag }}
      xcode-version: '26.3.0'
      create-github-release: ${{ github.event.inputs.create-github-release == 'true' && 'AEPEdge' || '' }}
      tag-only: false
      simulator-platforms: 'iOS, tvOS'
      version-validation-paths: AEPEdge.xcodeproj/project.pbxproj, Sources/EdgeConstants.swift
    secrets: inherit