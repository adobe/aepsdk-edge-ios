version: 2.1

orbs:
  macos: circleci/macos@2

workflows:
  version: 2
  build-and-test:
    jobs:
      - validate-code
      - test-ios-unit:
          requires:
            - validate-code
      - test-ios-functional:
          requires:
            - validate-code
      - test-ios-integration:
          requires:
            - validate-code
      - test-tvos-unit:
          requires:
            - validate-code
      - test-tvos-functional:
          requires:
            - validate-code
      - build-xcframework-and-app:
          requires:
            - validate-code

commands:
  install_dependencies:
    steps:
      - run:
          name: Install XcodeGen
          command: brew install xcodegen

      - restore_cache:
          name: Restore Gemfile cache
          keys:
            - gems-v1-{{ checksum "Gemfile.lock" }}
            - gems-v1-

      - run:
          name: Configure Bundler
          command: |
            bundle config set path 'vendor/bundle'
            bundle check || bundle install

      - save_cache:
          name: Save Gemfile cache
          key: gems-v1-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

      - restore_cache:
          name: Restore CocoaPods cache
          keys:
            - pods-v1-{{ checksum "Podfile.lock" }}
            - pods-v1-

      - run:
          name: Install CocoaPods
          command: make ci-pod-install

      - save_cache:
          name: Save CocoaPods cache
          key: pods-v1-{{ checksum "Podfile.lock" }}
          paths:
            - Pods
            - ~/.cocoapods

  prestart_ios_simulator:
    steps:
      - macos/preboot-simulator:
          platform: "iOS"
          device: "iPhone 18 Pro"
          version: "27.0"

  prestart_tvos_simulator:
    steps:
      - macos/preboot-simulator:
          platform: "tvOS"
          device: "Apple TV 4K (3rd generation)"
          version: "27.0"

  parse_and_upload_coverage:
    description: "Convert .xcresult → Cobertura XML and upload to Codecov"
    parameters:
      path: { type: string }
      flag: { type: string }
    steps:
      - run:
          name: Install xcresultparser
          command: brew list xcresultparser || brew install xcresultparser

      - run:
          name: Parse .xcresult bundle(s)
          command: |
            set -eo pipefail
            mkdir -p ./build/coverage

            BUNDLE="<< parameters.path >>"

            if [ -d "$BUNDLE" ]; then
              echo "Directory given; searching for .xcresult…"
              RESULT_FILES=$(find "$BUNDLE" -name "*.xcresult")
              [ -z "$RESULT_FILES" ] && { echo "No .xcresult found"; exit 0; }

              COUNT=$(echo "$RESULT_FILES" | wc -w)
              if [ "$COUNT" -gt 1 ]; then
                echo "Merging $COUNT result bundles"
                MERGE_CMD="xcrun xccov merge --output ./build/Merged.xcresult"
                for f in $RESULT_FILES; do MERGE_CMD="$MERGE_CMD $f"; done
                eval "$MERGE_CMD"
                xcresultparser --output-format cobertura ./build/Merged.xcresult > ./build/coverage/coverage.xml
              else
                echo "Single bundle found"
                xcresultparser --output-format cobertura $RESULT_FILES > ./build/coverage/coverage.xml
              fi
            else
              echo "File given; parsing $BUNDLE"
              xcresultparser --output-format cobertura "$BUNDLE" > ./build/coverage/coverage.xml
            fi

      - run:
          name: Upload coverage to Codecov
          command: |
            python3 -m pip install --user --break-system-packages codecov-cli || true
            export PATH="$(python3 -m site --user-base)/bin:$PATH"
            codecovcli upload-process \
              -t "${CODECOV_TOKEN}" \
              -f ./build/coverage/coverage.xml \
              -F "<< parameters.flag >>" \
              -n "<< parameters.flag >>" \
              --disable-search || echo "Codecov upload failed (non-fatal)"

jobs:
  validate-code:
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0

    steps:
      - checkout
      - install_dependencies
      - run:
          name: Lint Source Code
          command: make lint

  test-ios-unit:
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0

    environment:
      IOS_DEVICE_NAME: "iPhone 18 Pro"
      IOS_VERSION: "27.0"

    steps:
      - checkout
      - install_dependencies
      - prestart_ios_simulator
      - run:
          name: Run Unit Tests (iOS)
          command: make unit-test-ios
      - parse_and_upload_coverage:
          path: build/reports/iosUnitResults.xcresult
          flag: ios-unit-tests

  test-ios-functional:
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0

    environment:
      IOS_DEVICE_NAME: "iPhone 18 Pro"
      IOS_VERSION: "27.0"

    steps:
      - checkout
      - install_dependencies
      - prestart_ios_simulator
      - run:
          name: Run Functional Tests (iOS)
          command: make functional-test-ios
      - parse_and_upload_coverage:
          path: build/reports/iosFunctionalResults.xcresult
          flag: ios-functional-tests

  test-ios-integration:
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0

    environment:
      IOS_DEVICE_NAME: "iPhone 18 Pro"
      IOS_VERSION: "27.0"

    steps:
      - checkout
      - install_dependencies
      - prestart_ios_simulator
      - run:
          name: Run Integration Tests (iOS)
          command: make integration-test-ios
      - parse_and_upload_coverage:
          path: build/reports/iosIntegrationUpstreamResults.xcresult
          flag: ios-integration-tests

  test-tvos-unit:
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0

    environment:
      TVOS_DEVICE_NAME: "Apple TV 4K (3rd generation)"
      TVOS_VERSION: "27.0"

    steps:
      - checkout
      - install_dependencies
      - prestart_tvos_simulator
      - run:
          name: Run Unit Tests (tvOS)
          command: make unit-test-tvos
      - parse_and_upload_coverage:
          path: build/reports/tvosUnitResults.xcresult
          flag: tvos-unit-tests

  test-tvos-functional:
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0

    environment:
      TVOS_DEVICE_NAME: "Apple TV 4K (3rd generation)"
      TVOS_VERSION: "27.0"

    steps:
      - checkout
      - install_dependencies
      - prestart_tvos_simulator
      - run:
          name: Run Functional Tests (tvOS)
          command: make functional-test-tvos
      - parse_and_upload_coverage:
          path: build/reports/tvosFunctionalResults.xcresult
          flag: tvos-functional-tests

  build-xcframework-and-app:
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0

    steps:
      - checkout
      - install_dependencies
      - run:
          name: Build XCFramework
          command: make archive
      - run:
          name: Build Test App
          command: make build-app
